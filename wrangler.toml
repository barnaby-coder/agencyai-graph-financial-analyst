name = "agencyai-graph-financial-analyst"
main = "src/worker.mjs"
compatibility_date = "2026-09-05"
workers_dev = true

[vars]
OPENAI_API_URL = "https://api.openai.com/v1/responses"
OPENAI_MODEL = "gpt-5.6-luna"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/health"]
